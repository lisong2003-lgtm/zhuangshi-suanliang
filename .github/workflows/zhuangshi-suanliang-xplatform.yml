name: zhuangshi-suanliang cross-platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Setup openpyxl
        run: python -m pip install --disable-pip-version-check --no-input -q openpyxl

      - name: unittest discover（5 tests）
        run: python -m unittest discover -s scripts/tests

      - name: Windows 中文 JSON 输出验证
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/smoke_utf8_json.py
      - name: i18n 英文 smoke（--lang en JSON 可读）
        run: python scripts/smoke_utf8_json.py --lang en
